release-cleanup = true
patcher-args = "--striplibs=arm64-v8a"

[YouTube]
package-name = "com.google.android.youtube"
app-source = "rjaakash/peachmeow-store"
patcher-args = "-d 'Custom branding' -e 'Hide Shorts components' -OhideShortsAppShortcut=true -OhideShortsWidget=true"

[Music]
package-name = "com.google.android.apps.youtube.music"
app-source = "rjaakash/peachmeow-store"
patcher-args = "-d 'Custom branding'"

[Reddit]
package-name = "com.reddit.frontpage"
app-source = "rjaakash/peachmeow-store"

["Photos De-Vanced"]
package-name = "com.google.android.apps.photos"
app-name = "Photos"
app-source = "rjaakash/peachmeow-store"
patches-source = "RookieEnough/De-Vanced"
morphe-brand = "De-Vanced"
patcher-args = "-e 'Enable DCIM folders backup control'"

["Proton VPN hoodles"]
package-name = "ch.protonvpn.android"
app-name = "ProtonVPN"
app-source = "ProtonVPN/android-app"
app-version = "🐱"
patches-source = "hoo-dles/morphe-patches"
morphe-brand = "hoodles"
patcher-args = "-f"
